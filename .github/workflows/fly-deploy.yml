# Fly.io へ自動デプロイする。
# 必要なもの: リポジトリの Secret「FLY_API_TOKEN」（Fly.io のトークン）
# 任意: リポジトリの Variable「FLY_APP_NAME」（未設定なら futari-<GitHubユーザー名>）
name: Deploy to Fly.io

on:
  workflow_dispatch:
  push:
    branches: [main, claude/fervent-albattani-sw182i]
    paths-ignore: ['.github/workflows/fly-logs.yml']

concurrency: fly-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: ${{ vars.FLY_APP_NAME || format('futari-{0}', github.repository_owner) }}
      REGION: nrt
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN が未設定のためデプロイをスキップしました（Settings → Secrets and variables → Actions で登録してください）"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.ok == 'true'

      - name: Verify token
        if: steps.token.outputs.ok == 'true'
        run: |
          # 形式だけを表示（トークンの中身は表示しない）
          case "$FLY_API_TOKEN" in
            "FlyV1 "*) echo "token format: FlyV1 (OK)";;
            fm1*|fm2*) echo "token format: macaroon without 'FlyV1 ' prefix";;
            *) echo "token format: unknown (length ${#FLY_API_TOKEN})";;
          esac
          if printf '%s' "$FLY_API_TOKEN" | grep -q '[[:space:]]$'; then echo "::warning::トークンの末尾に空白/改行があります"; fi
          if ! flyctl auth whoami; then
            echo "::error::Fly.io がトークンを受け付けませんでした。Organization トークンを作り直して FLY_API_TOKEN を更新してください"
            exit 1
          fi
          flyctl orgs list

      - name: Create app (first time only)
        if: steps.token.outputs.ok == 'true'
        run: |
          # 無料期間が終わっているとすべての操作が断られるので、先に分かりやすく伝える
          if flyctl apps list --json 2>&1 | grep -q 'trial has ended'; then
            echo "::error::Fly.io の無料期間が終わりました。https://fly.io/trial でクレジットカードを登録してから、もう一度デプロイしてください"
            exit 1
          fi
          if flyctl apps list --json | grep -q "\"Name\": *\"$APP\""; then
            echo "app $APP exists"
            exit 0
          fi
          if flyctl apps create "$APP" --org personal; then exit 0; fi
          # 失敗の原因を切り分ける: 別の名前なら作れるか？
          probe="futari-probe-$(date +%s)"
          if flyctl apps create "$probe" --org personal; then
            flyctl apps destroy "$probe" --yes
            echo "::error::アプリ名「$APP」はほかの人が使っています。Variables の FLY_APP_NAME に別の名前を設定してください"
          else
            echo "::error::このトークンではアプリを作れません。読み取り専用ではない Organization トークンを作るか、Fly.io にカードが登録されているか確認してください"
          fi
          exit 1

      - name: Create volume (first time only)
        if: steps.token.outputs.ok == 'true'
        run: |
          if flyctl volumes list -a "$APP" --json | grep -q '"name": *"futari_data"'; then
            echo "volume exists"
          else
            flyctl volumes create futari_data -a "$APP" --region "$REGION" --size 1 --yes
          fi

      - name: Set secrets (optional)
        if: steps.token.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          # レシート読み取り用。GitHub の Secret にあれば Fly.io に渡す（このあとのデプロイで反映）
          for name in ANTHROPIC_API_KEY ANTHROPIC_WORKSPACE_ID; do
            if [ -n "${!name}" ]; then
              printf '%s=%s\n' "$name" "${!name}" | flyctl secrets import -a "$APP" --stage
              echo "$name を設定しました"
            else
              echo "$name は未設定です"
            fi
          done

      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: flyctl deploy -a "$APP" --remote-only --ha=false --primary-region "$REGION"

      - name: Health check
        if: steps.token.outputs.ok == 'true'
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://$APP.fly.dev/api/health"; then
              echo
              echo "### ✅ 公開しました: https://$APP.fly.dev" >> "$GITHUB_STEP_SUMMARY"
              features=$(curl -fsS "https://$APP.fly.dev/api/features" || echo '{}')
              echo "features: $features"
              echo "使える機能: $features" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "health check failed"; exit 1
