# Fly.io の設定。app 名は `fly launch --no-deploy` で自分用のものに書き換わります。
app = "futari-app"
primary_region = "nrt" # 東京

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"
  TZ = "Asia/Tokyo" # 朝の通知などの時刻は日本時間

# ふたりのデータを保存する永続ディスク
[[mounts]]
  source = "futari_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # 朝の通知などを決まった時刻に送るため、常に1台動かしておく
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
