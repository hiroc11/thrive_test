<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e07a5f">
  <title>ふたりの暮らし</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ふたり">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="title-wrap"><button id="back" class="icon-btn back" aria-label="戻る" hidden></button><h1 id="page-title">今日</h1><span id="sync-status" class="sync-dot" role="img"></span></div>
    <button id="settings-btn" class="icon-btn head-btn" aria-label="設定"></button>
  </header>

  <main id="view"></main>

  <button id="fab" class="fab" aria-label="記録する"></button>
  <div id="sheet" class="sheet" hidden></div>
  <div id="onboard" class="onboard" hidden></div>

  <nav class="tabs">
    <button data-tab="home">今日</button>
    <button data-tab="chores">家事</button>
    <button data-tab="shopping">買い物</button>
    <button data-tab="budget">家計簿</button>
    <button data-tab="futari">ふたり</button>
  </nav>

  <script src="icons.js"></script>
  <script src="illustrations.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>

</html>
