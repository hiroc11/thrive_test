<title>ぷくホロシール帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=DM+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #f5eff8;
    --page: #fffafd;
    --page-line: #f0e4f3;
    --ink: #3a2d45;
    --muted: #85759a;
    --accent: #e8508f;
    --chip-normal: #e9e4ee;
    --chip-normal-ink: #5d5169;
    --chip-rare: #dcecff;
    --chip-rare-ink: #2b5b95;
    --chip-srare: #ffe0ee;
    --chip-srare-ink: #a8255d;
    --shadow: rgba(80, 40, 90, .28);
    --round: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1c1722;
      --page: #282130;
      --page-line: #342b3e;
      --ink: #f3eaf7;
      --muted: #b3a3c2;
      --accent: #ff7fb4;
      --chip-normal: #3a3244;
      --chip-normal-ink: #d9cfe3;
      --chip-rare: #1f3552;
      --chip-rare-ink: #a9cdfb;
      --chip-srare: #4a1f33;
      --chip-srare-ink: #ffb3d2;
      --shadow: rgba(0, 0, 0, .55);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1c1722;
    --page: #282130;
    --page-line: #342b3e;
    --ink: #f3eaf7;
    --muted: #b3a3c2;
    --accent: #ff7fb4;
    --chip-normal: #3a3244;
    --chip-normal-ink: #d9cfe3;
    --chip-rare: #1f3552;
    --chip-rare-ink: #a9cdfb;
    --chip-srare: #4a1f33;
    --chip-srare-ink: #ffb3d2;
    --shadow: rgba(0, 0, 0, .55);
  }

  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--round);
    font-weight: 500;
    padding: 0 16px;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding-block: 28px 40px; display: grid; gap: 20px; }

  header { display: grid; gap: 8px; }
  h1 { margin: 0; font-size: clamp(28px, 7vw, 38px); font-weight: 900; letter-spacing: .02em; text-wrap: balance; }
  h1 span { color: var(--accent); }
  .lead { margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; }
  .sensor { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .sensor button {
    font: inherit; font-weight: 700; font-size: 13px;
    border: 2px solid var(--accent); color: var(--accent); background: transparent;
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .sensor button:focus-visible, .cell:focus-visible, dialog button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .sensor small { color: var(--muted); font-size: 12px; }

  /* シール帳の台紙（剥離紙のような細いストライプ） */
  .book {
    background:
      repeating-linear-gradient(0deg, transparent 0 23px, var(--page-line) 23px 24px),
      var(--page);
    border-radius: 18px;
    padding: 18px 12px 12px;
    box-shadow: 0 1px 0 var(--page-line), 0 10px 30px -18px var(--shadow);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 4px;
  }
  .cell {
    display: grid; justify-items: center; gap: 4px;
    background: none; border: 0; padding: 0 0 8px; color: inherit; font: inherit;
    cursor: pointer; border-radius: 12px;
  }
  .name { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.3; }
  .serial { font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip {
    font-size: 10px; font-weight: 700; letter-spacing: .06em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--chip-normal); color: var(--chip-normal-ink);
  }
  .chip.rare { background: var(--chip-rare); color: var(--chip-rare-ink); }
  .chip.srare { background: var(--chip-srare); color: var(--chip-srare-ink); }
  .chip.secret { background: linear-gradient(90deg, #f6d77a, #fff3c4, #e2ac3f); color: #5a3c05; }

  .legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .legend div { display: grid; gap: 2px; font-size: 12px; line-height: 1.5; color: var(--muted); }
  .legend b { color: var(--ink); font-size: 13px; }
  @media (max-width: 380px) { .legend { grid-template-columns: 1fr; } }

  /* ---------- シール本体 ---------- */
  .st { --tx: 0; --ty: 0; --mag: 0; --sp1: .5; --sp2: .5; position: relative; width: 100%; aspect-ratio: 1; touch-action: none; }
  .tilt {
    position: absolute; inset: 12%;
    transform: perspective(520px) rotateX(calc(var(--ty) * -16deg)) rotateY(calc(var(--tx) * 16deg));
    filter: drop-shadow(calc(var(--tx) * -5px) calc(6px + var(--ty) * -3px) 5px var(--shadow));
  }
  .edge, .face { position: absolute; -webkit-mask: var(--mask) center / 100% 100% no-repeat; mask: var(--mask) center / 100% 100% no-repeat; }
  .edge { inset: -7%; background: #fff; }
  .face { inset: 0; isolation: isolate; overflow: hidden; }
  .face > i { position: absolute; inset: 0; display: none; }
  .base { display: block !important; background: var(--base); }

  /* ホロ：虹色の帯が傾きに合わせて流れる */
  .holo .rainbow, .secret .rainbow {
    display: block;
    background: repeating-linear-gradient(115deg, #ff8fd0 0%, #ffe38a 7%, #8dffc6 14%, #8fd0ff 21%, #d6a0ff 28%, #ff8fd0 35%);
    background-size: 300% 300%;
    background-position: calc(50% + var(--tx) * 70%) calc(50% + var(--ty) * 70%);
    mix-blend-mode: hard-light;
    opacity: calc(.4 + var(--mag) * .5);
  }
  .holo .foil, .secret .foil {
    display: block;
    background:
      repeating-linear-gradient(60deg, transparent 0 5px, rgba(255,255,255,.4) 5px 6px),
      repeating-linear-gradient(-60deg, transparent 0 7px, rgba(255,255,255,.25) 7px 8px);
    background-position: calc(var(--tx) * 14px) calc(var(--ty) * 14px);
    mix-blend-mode: overlay;
  }
  .holo .glare, .secret .glare {
    display: block;
    background: linear-gradient(calc(115deg + var(--tx) * 25deg), transparent 30%, rgba(255,255,255,.75) 48%, transparent 62%);
    background-size: 250% 250%;
    background-position: calc(50% - var(--tx) * 60%) calc(50% - var(--ty) * 60%);
    mix-blend-mode: soft-light;
  }

  /* ラメ：粒が角度によってまたたく */
  .glitter .g1, .glitter .g2, .secret .g1, .secret .g2 {
    display: block;
    background-image: var(--glitter);
    background-size: 70px 70px;
    mix-blend-mode: screen;
  }
  .glitter .g1, .secret .g1 { opacity: var(--sp1); background-position: calc(var(--tx) * 6px) calc(var(--ty) * 6px); }
  .glitter .g2, .secret .g2 { opacity: var(--sp2); background-position: calc(35px - var(--tx) * 6px) calc(21px - var(--ty) * 6px); }
  .glitter .glare { display: block; background: radial-gradient(ellipse 60% 45% at calc(50% - var(--tx) * 30%) calc(40% - var(--ty) * 30%), rgba(255,255,255,.35), transparent 70%); }

  /* ぷっくり：ふちの影と、動くツヤ */
  .puffy .rim {
    display: block;
    background: radial-gradient(circle at 50% 45%, transparent 48%, rgba(60, 0, 40, .28) 100%);
    mix-blend-mode: multiply;
  }
  .puffy .gloss {
    display: block;
    background: radial-gradient(ellipse 48% 36% at calc(50% - var(--tx) * 22%) calc(34% - var(--ty) * 18%), rgba(255,255,255,.85), rgba(255,255,255,.25) 45%, transparent 72%);
  }
  .puffy .dot {
    display: block; inset: auto;
    left: calc(24% - var(--tx) * 8%); top: calc(18% - var(--ty) * 8%);
    width: 18%; height: 10%; border-radius: 50%;
    background: rgba(255,255,255,.95); transform: rotate(-32deg); filter: blur(.6px);
  }
  .kao { position: absolute; inset: 0; display: block !important; }
  .kao::before, .kao::after {
    content: ""; position: absolute; top: 46%; width: 9%; height: 11%; border-radius: 50%; background: #4a2140;
  }
  .kao::before { left: 33%; }
  .kao::after { right: 33%; }
  .kao b { position: absolute; left: 43%; top: 58%; width: 14%; height: 7%; border: 3px solid #4a2140; border-top: 0; border-radius: 0 0 50% 50% / 0 0 100% 100%; }
  .kao em { position: absolute; top: 58%; width: 12%; height: 6%; border-radius: 50%; background: rgba(255, 90, 140, .45); }
  .kao em:first-of-type { left: 20%; }
  .kao em:last-of-type { right: 20%; }

  /* ---------- パック開封 ---------- */
  .opener { display: grid; gap: 12px; justify-items: center; }
  .stage { --glow: #ffffff; position: relative; width: 100%; height: 330px; overflow: hidden; border-radius: 18px;
    background: radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--glow) 22%, var(--page)), var(--bg) 70%); }
  .stage[data-r="rare"] { --glow: #8fd0ff; }
  .stage[data-r="srare"] { --glow: #ff8fd0; }
  .stage[data-r="secret"] { --glow: #ffd766; }
  .rays {
    position: absolute; left: 50%; top: 50%; width: 560px; height: 560px; margin: -280px 0 0 -280px;
    background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--glow) 70%, transparent) 0 6deg, transparent 6deg 18deg);
    -webkit-mask: radial-gradient(circle, #000 12%, transparent 62%); mask: radial-gradient(circle, #000 12%, transparent 62%);
    opacity: 0; transition: opacity .5s; animation: spin 14s linear infinite;
  }
  .stage.lit .rays { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .glow { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%;
    background: radial-gradient(circle, var(--glow), transparent 65%); opacity: 0; }

  .pack { --tear: 0; position: absolute; left: 50%; top: 50%; width: 160px; height: 224px; margin: -112px 0 0 -80px;
    touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  .pack-top, .pack-body {
    position: absolute; left: 0; right: 0;
    background:
      repeating-linear-gradient(115deg, #ff8fd0 0%, #ffe38a 7%, #8dffc6 14%, #8fd0ff 21%, #d6a0ff 28%, #ff8fd0 35%) calc(50% + var(--tx) * 70%) calc(50% + var(--ty) * 70%) / 300% 300%,
      linear-gradient(160deg, #f4c6de, #b9a6ee);
    background-blend-mode: soft-light;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.5);
  }
  .pack-top { top: 0; height: 16%; border-radius: 12px 12px 0 0; border-bottom: 2px dashed rgba(255,255,255,.85); }
  .pack-top::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 7px; border-radius: 12px 12px 0 0;
    background: repeating-linear-gradient(90deg, rgba(90,40,90,.18) 0 3px, transparent 3px 6px); }
  .pack-top::after { content: ""; position: absolute; left: 0; bottom: -2px; height: 2px; width: calc(var(--tear) * 100%);
    background: #fff; box-shadow: 0 0 8px 2px #fff; }
  .pack-body { top: 16%; bottom: 0; border-radius: 0 0 14px 14px; display: grid; place-content: center; text-align: center; gap: 2px;
    color: #4a2152; box-shadow: inset 0 0 0 1px rgba(255,255,255,.5), 0 14px 24px -12px var(--shadow); }
  .pack-body b { font-size: 30px; font-weight: 900; letter-spacing: .02em; }
  .pack-body span { font-size: 12px; font-weight: 700; }
  .pack-body small { font-family: var(--mono); font-size: 10px; opacity: .75; }
  .hint { position: absolute; left: 0; right: 0; top: 20px; text-align: center; font-size: 13px; font-weight: 700; color: var(--accent); }

  .slot { position: absolute; left: 50%; top: 50%; width: 190px; height: 190px; margin: -95px 0 0 -95px; }
  .spark { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; pointer-events: none; }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 5; }

  .result { display: grid; gap: 6px; justify-items: center; text-align: center; }
  .result h2 { margin: 0; font-size: 22px; font-weight: 900; }
  .result .meta { display: flex; gap: 8px; align-items: center; }
  .result p { margin: 0; font-size: 12px; color: var(--muted); }
  .btn {
    font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 10px 26px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent); padding: 8px 20px; }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .odds { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .odds summary { cursor: pointer; }
  .odds table { border-collapse: collapse; margin-top: 6px; }
  .odds td { padding: 2px 10px 2px 0; }
  .new { position: absolute; top: 2px; left: 4px; font-size: 10px; font-weight: 900; color: #fff; background: var(--accent);
    border-radius: 6px; padding: 1px 6px; transform: rotate(-8deg); }
  .cell { position: relative; }

  /* ---------- 友達と交換 ---------- */
  .friend-card { display: flex; align-items: center; gap: 12px; background: var(--page); border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 10px 30px -22px var(--shadow); }
  .friend-card .who { flex: 1; display: grid; gap: 2px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .friend-card .who b { color: var(--ink); font-size: 14px; }
  .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, #ffb3d2, #c9b3ff); color: #fff; font-weight: 900; font-size: 17px; }

  dialog.trade { width: min(480px, calc(100vw - 16px)); max-height: calc(100dvh - 16px); padding: 14px 12px; overflow: auto; }
  .t-head { position: relative; display: flex; align-items: center; gap: 10px; padding: 0 4px; }
  .t-head .who { flex: 1; display: grid; font-size: 12px; color: var(--muted); }
  .t-head .who b { color: var(--ink); font-size: 15px; }
  .t-head .who .ok { color: var(--accent); font-weight: 700; }
  .x { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--page-line); color: var(--ink); font: inherit; font-size: 18px; cursor: pointer; }
  .hand { display: flex; gap: 6px; overflow-x: auto; padding: 10px 4px 6px; min-height: 96px; }
  .hand:empty::before { content: "（なし）"; margin: auto; font-size: 12px; color: var(--muted); }
  .item { position: relative; flex: none; width: 68px; display: grid; justify-items: center; background: none; border: 0; padding: 0;
    color: inherit; font: inherit; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 10px; }
  .item:focus-visible, .stamp:focus-visible, .hold:focus-visible, .x:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .item .serial { font-size: 9.5px; }
  .item.lifted { opacity: .25; }
  .want { position: absolute; top: 0; right: 0; background: var(--accent); color: #fff; font-size: 9px; font-weight: 900; padding: 1px 5px; border-radius: 6px; }
  .treasure { position: absolute; top: 0; right: 0; background: #e2ac3f; color: #fff; font-size: 9px; font-weight: 900; padding: 1px 5px; border-radius: 6px; }
  .table { position: relative; display: grid; gap: 8px; padding: 10px; border-radius: 16px;
    background: color-mix(in srgb, var(--accent) 7%, var(--page)); }
  .zone { position: relative; min-height: 104px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: center;
    padding: 20px 6px 6px; border: 2px dashed var(--page-line); border-radius: 12px; transition: background .2s; }
  .zone.mine { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .zone.over { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .zlabel { position: absolute; top: 4px; left: 10px; font-size: 10.5px; font-weight: 700; color: var(--muted); }
  .scale { display: flex; align-items: center; gap: 10px; font-size: 10.5px; font-weight: 700; color: var(--muted); padding: 2px 6px 8px; }
  .beam { position: relative; flex: 1; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #c9b3ff, var(--accent));
    transition: transform .6s cubic-bezier(.3, 1.6, .5, 1); }
  .beam::after { content: ""; position: absolute; left: 50%; top: 6px; margin-left: -6px; border: 6px solid transparent; border-bottom-color: var(--muted); }
  .bubble { position: absolute; z-index: 3; max-width: 72%; padding: 6px 12px; border-radius: 14px; font-size: 12.5px; font-weight: 700; line-height: 1.5; }
  .bubble.friend { left: 54px; top: 42px; background: var(--ink); color: var(--page); border-top-left-radius: 4px; }
  .bubble.me { right: 10px; bottom: -12px; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .stamps { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding-top: 6px; }
  .stamp { font: inherit; font-size: 12px; font-weight: 700; border: 0; border-radius: 999px; padding: 7px 13px;
    background: var(--chip-srare); color: var(--chip-srare-ink); cursor: pointer; }
  .hold { --p: 0; width: 100%; margin-top: 10px; padding: 14px; border: 0; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 900; color: #fff;
    background: linear-gradient(90deg, var(--accent) calc(var(--p) * 100%), color-mix(in srgb, var(--accent) 50%, var(--page)) 0);
    cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
  .ghost { position: fixed; z-index: 10; width: 72px; pointer-events: none; transform: translate(-50%, -50%) scale(1.15); }
  .done { display: grid; gap: 10px; justify-items: center; text-align: center; padding: 18px 6px 6px; }
  .done h2 { margin: 0; font-size: 24px; font-weight: 900; }
  .done .got { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .done .got .st { width: 120px; }
  .done p { margin: 0; font-size: 13px; color: var(--muted); }

  /* ---------- 拡大表示 ---------- */
  dialog {
    border: 0; border-radius: 22px; padding: 22px 20px 18px;
    width: min(360px, calc(100vw - 32px));
    background: var(--page); color: var(--ink);
    box-shadow: 0 30px 60px -20px var(--shadow);
  }
  dialog::backdrop { background: rgba(30, 15, 40, .45); }
  .detail { display: grid; gap: 10px; justify-items: center; text-align: center; }
  .detail .st { width: min(260px, 70vw); }
  .detail h2 { margin: 0; font-size: 22px; font-weight: 900; }
  .detail .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .detail .serial { font-size: 13px; }
  .detail p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .rate { display: flex; gap: 4px; }
  .rate i { width: 10px; height: 10px; border-radius: 50%; background: var(--page-line); }
  .rate i.on { background: var(--accent); }
  dialog button {
    font: inherit; font-weight: 700; margin-top: 4px;
    border: 0; border-radius: 999px; padding: 10px 28px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
</style>

<div class="wrap">
  <header>
    <h1>ぷく<span>ホロ</span>シール帳</h1>
    <p class="lead">スマホを傾けるか、シールを指でなぞってみてください。タップすると大きく見られます。<br>どのシールも通し番号つきの数量限定です。</p>
    <div class="sensor" id="sensorRow" hidden>
      <button type="button" id="sensorBtn">傾きセンサーを使う</button>
      <small id="sensorMsg"></small>
    </div>
  </header>

  <section class="opener" aria-label="シールパック">
    <div class="stage" id="stage">
      <div class="rays"></div>
      <div class="glow" id="glow"></div>
      <div class="slot" id="slot"></div>
      <div class="pack" id="pack">
        <div class="pack-top" id="packTop"></div>
        <div class="pack-body"><b>ぷくホロ</b><span>シールパック vol.1</span><small>1パック1枚入り</small></div>
      </div>
      <div class="hint" id="hint">切り取り線を横になぞって開けよう →</div>
    </div>
    <div class="result" id="result" hidden>
      <h2 id="rName"></h2>
      <div class="meta"><span class="chip" id="rChip"></span><span class="serial" id="rSerial"></span></div>
      <p id="rLeft"></p>
    </div>
    <button type="button" class="btn" id="mainBtn">タップで開ける</button>
    <details class="odds">
      <summary>排出率</summary>
      <table><tbody>
        <tr><td>ノーマル</td><td>60%</td></tr>
        <tr><td>レア</td><td>28%</td></tr>
        <tr><td>Sレア</td><td>10%</td></tr>
        <tr><td>シークレット</td><td>2%</td></tr>
      </tbody></table>
    </details>
  </section>

  <section class="friend-card" aria-label="交換のお誘い">
    <div class="avatar" aria-hidden="true">ゆ</div>
    <div class="who"><b>ゆいな</b><span id="friendNote">交換したがっています</span></div>
    <button type="button" class="btn" id="tradeOpen">交換する</button>
  </section>

  <section class="book" id="book" aria-label="シール帳 1ページ目"></section>

  <section class="legend" aria-label="シールの種類">
    <div><b>ホロ</b>虹色が角度で流れる</div>
    <div><b>ぷっくり</b>ツヤの点が動く</div>
    <div><b>ラメ</b>粒がキラッとまたたく</div>
  </section>
</div>

<dialog id="dlg" aria-labelledby="dName">
  <div class="detail">
    <div id="dSticker"></div>
    <h2 id="dName"></h2>
    <div class="meta"><span class="chip" id="dChip"></span><span class="serial" id="dSerial"></span></div>
    <div class="rate" id="dRate" aria-label="交換レート"></div>
    <p id="dNote"></p>
    <button type="button" id="dClose">閉じる</button>
  </div>
</dialog>

<dialog id="trade" class="trade" aria-label="ゆいなとの交換テーブル">
  <div id="tMain">
    <div class="t-head">
      <div class="avatar" aria-hidden="true">ゆ</div>
      <div class="who"><b>ゆいな</b><span id="tStatus">考え中…</span></div>
      <button type="button" class="x" id="tClose" aria-label="交換をやめる">×</button>
      <div class="bubble friend" id="fBubble" hidden></div>
    </div>
    <div class="hand" id="fHand" aria-label="ゆいなの手持ち（タップでおねだり）"></div>
    <div class="table">
      <div class="zone" id="fZone"><span class="zlabel">ゆいなが出す</span></div>
      <div class="scale" aria-hidden="true"><span>ゆいな</span><div class="beam" id="beam"></div><span>あなた</span></div>
      <div class="zone mine" id="mZone"><span class="zlabel">あなたが出す（ドラッグかタップで置く）</span></div>
      <div class="bubble me" id="mBubble" hidden></div>
    </div>
    <div class="hand" id="mHand" aria-label="あなたの手持ち"></div>
    <div class="stamps">
      <button type="button" class="stamp">おねがい</button>
      <button type="button" class="stamp">ほしい！</button>
      <button type="button" class="stamp">むり〜</button>
      <button type="button" class="stamp">かわいい</button>
    </div>
    <button type="button" class="hold" id="hold">長押しで「せーの」</button>
  </div>
  <div class="done" id="tDone" hidden>
    <h2>交換成立！</h2>
    <div class="got" id="tGot"></div>
    <p id="tGotText"></p>
    <button type="button" class="btn" id="tFinish">シール帳を見る</button>
  </div>
</dialog>

<script>
(() => {
  const SHAPES = {
    heart: '<path d="M50 90C19 67 5 51 5 32 5 17 17 7 30 7c9 0 16 5 20 12 4-7 11-12 20-12 13 0 25 10 25 25 0 19-14 35-45 58Z"/>',
    star: '<path d="M50 4c3 0 4 2 5 4l9 20 22 3c5 1 7 6 3 9L73 56l4 22c1 5-4 8-8 6L50 73 31 84c-4 2-9-1-8-6l4-22L11 40c-4-3-2-8 3-9l22-3 9-20c1-2 2-4 5-4Z"/>',
    circle: '<circle cx="50" cy="50" r="46"/>',
    cloud: '<path d="M26 80C11 80 4 67 10 56 3 43 15 29 29 34c4-17 29-21 37-5 14-8 31 3 26 19 10 7 6 32-12 32Z"/>'
  };
  const maskURI = shape =>
    `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>${SHAPES[shape]}</svg>`)}")`;

  const RARITY = {
    normal: ['ノーマル', ''], rare: ['レア', 'rare'], srare: ['Sレア', 'srare'], secret: ['シークレット', 'secret']
  };

  const STICKERS = [
    { name: 'ゆめかわハート', shape: 'heart', kind: 'holo', rarity: 'rare', no: 37, of: 300, rate: 3,
      base: 'linear-gradient(135deg,#c9d0dc,#8f9bb0 45%,#d7dce6 70%,#9aa6ba)' },
    { name: 'もちまる', shape: 'circle', kind: 'puffy', rarity: 'normal', no: 1204, of: 5000, rate: 1, kao: true,
      base: 'radial-gradient(circle at 45% 40%,#ffd9ea,#ffa1ca 60%,#ef6aa6 100%)' },
    { name: 'きらきらくも', shape: 'cloud', kind: 'glitter', rarity: 'rare', no: 88, of: 500, rate: 3,
      base: 'linear-gradient(160deg,#d6c5ff,#a28af3)' },
    { name: 'いちごミルク', shape: 'heart', kind: 'puffy', rarity: 'srare', no: 12, of: 200, rate: 4,
      base: 'radial-gradient(circle at 45% 38%,#ffe4e9,#ff8ea3 55%,#e44f6d 100%)' },
    { name: 'ながれぼし', shape: 'star', kind: 'holo', rarity: 'srare', no: 45, of: 150, rate: 4,
      base: 'linear-gradient(135deg,#b9c6ef,#7486c4 50%,#c8d2f5)' },
    { name: 'ひみつの一番星', shape: 'star', kind: 'secret', rarity: 'secret', no: 7, of: 100, rate: 5,
      base: 'linear-gradient(135deg,#f3d27a,#c8922a 45%,#f5dc92 70%,#a8741c)' }
  ];

  // ラメの粒テクスチャをその場で生成
  (function makeGlitter() {
    const c = document.createElement('canvas');
    c.width = c.height = 140;
    const g = c.getContext('2d');
    const colors = ['#ffffff', '#fff3b0', '#ffc2e2', '#bdf3ff', '#e2ccff'];
    for (let i = 0; i < 260; i++) {
      g.fillStyle = colors[i % colors.length];
      g.globalAlpha = .5 + Math.random() * .5;
      const x = Math.random() * 140, y = Math.random() * 140, r = .5 + Math.random() * 1.3;
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
      if (i % 23 === 0) { // ときどき十字の光
        g.fillRect(x - 5, y - .5, 10, 1);
        g.fillRect(x - .5, y - 5, 1, 10);
      }
    }
    document.documentElement.style.setProperty('--glitter', `url(${c.toDataURL()})`);
  })();

  function makeSticker(s) {
    const el = document.createElement('div');
    el.className = `st ${s.kind}`;
    el.style.setProperty('--mask', maskURI(s.shape));
    el.style.setProperty('--base', s.base);
    el.seed = Math.random() * 6;
    el.innerHTML = `<div class="tilt"><div class="edge"></div><div class="face">
      <i class="base"></i><i class="rainbow"></i><i class="foil"></i><i class="g1"></i><i class="g2"></i>
      <i class="rim"></i><i class="glare"></i><i class="gloss"></i><i class="dot"></i>
      ${s.kao ? '<i class="kao"><em></em><b></b><em></em></i>' : ''}
    </div></div>`;
    return el;
  }

  const fmt = s => `No.${String(s.no).padStart(String(s.of).length, '0')} / ${s.of}`;

  const book = document.getElementById('book');
  const live = []; // 傾きを反映するシール
  function addCell(s, isNew) {
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cell';
    cell.setAttribute('aria-label', `${s.name}（${RARITY[s.rarity][0]}）を大きく見る`);
    const st = makeSticker(s);
    st.idx = live.length;
    cell.append(st);
    cell.insertAdjacentHTML('beforeend',
      `<span class="name">${s.name}</span><span class="chip ${RARITY[s.rarity][1]}">${RARITY[s.rarity][0]}</span><span class="serial">${fmt(s)}</span>` +
      (isNew ? '<span class="new">NEW</span>' : ''));
    cell.addEventListener('click', () => { if (!dragged) open(s); });
    if (isNew) book.prepend(cell); else book.append(cell);
    live.push(st);
    s.cell = cell;
    s.st = st;
    if (isNew) owned.unshift(s); else owned.push(s);
  }
  const owned = []; // 自分のシール帳に入っているシール
  function removeOwned(s) {
    owned.splice(owned.indexOf(s), 1);
    live.splice(live.indexOf(s.st), 1);
    s.cell.remove();
  }
  STICKERS.forEach(s => addCell(s, false));

  // ---------- パックの中身（デザインごとに発行済み枚数を数える） ----------
  const POOL = [
    ...STICKERS.map(s => ({ ...s, issued: s.no })),
    { name: 'みかんまる', shape: 'circle', kind: 'puffy', rarity: 'normal', issued: 2210, of: 5000, rate: 1, kao: true,
      base: 'radial-gradient(circle at 45% 40%,#ffe7c2,#ffb45c 60%,#f08a2c 100%)' },
    { name: 'ミントぐも', shape: 'cloud', kind: 'glitter', rarity: 'normal', issued: 1873, of: 5000, rate: 1,
      base: 'linear-gradient(160deg,#c6f5e6,#7fd8bd)' }
  ];
  const ODDS = [['normal', 60], ['rare', 28], ['srare', 10], ['secret', 2]];
  function draw() {
    let roll = Math.random() * 100, rarity = 'normal';
    for (const [r, w] of ODDS) { if ((roll -= w) < 0) { rarity = r; break; } }
    const choices = POOL.filter(p => p.rarity === rarity && p.issued < p.of);
    const d = choices[Math.floor(Math.random() * choices.length)];
    d.issued++;
    return { ...d, no: d.issued };
  }

  // ---------- 開封演出 ----------
  const stage = document.getElementById('stage');
  const pack = document.getElementById('pack');
  const packTop = document.getElementById('packTop');
  const slot = document.getElementById('slot');
  const glow = document.getElementById('glow');
  const hint = document.getElementById('hint');
  const result = document.getElementById('result');
  const mainBtn = document.getElementById('mainBtn');
  pack.idx = 20;
  let state = 'idle', current = null, revealed = null;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const anim = (el, frames, opts) => el.animate(frames, { fill: 'forwards', easing: 'cubic-bezier(.2,.8,.2,1)', ...opts }).finished;

  // 切り取り線をなぞる
  let tearFrom = null;
  pack.addEventListener('pointerdown', e => {
    if (state !== 'idle') return;
    tearFrom = e.clientX;
    pack.setPointerCapture(e.pointerId);
  });
  pack.addEventListener('pointermove', e => {
    if (tearFrom == null) return;
    const t = Math.max(0, Math.min(1, (e.clientX - tearFrom) / (pack.offsetWidth * .8)));
    pack.style.setProperty('--tear', t.toFixed(3));
    if (t >= 1) { tearFrom = null; openPack(); }
  });
  pack.addEventListener('pointerup', () => {
    if (tearFrom == null) return;
    tearFrom = null;
    if (state === 'idle') pack.style.setProperty('--tear', 0);
  });

  function burst(count, colors) {
    for (let i = 0; i < count; i++) {
      const s = document.createElement('i');
      s.className = 'spark';
      s.style.background = colors[i % colors.length];
      stage.append(s);
      const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 110, size = .5 + Math.random();
      s.animate([
        { transform: `translate(0,0) scale(${size})`, opacity: 1 },
        { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(0)`, opacity: 0 }
      ], { duration: 900 + Math.random() * 600, easing: 'cubic-bezier(.1,.8,.3,1)' }).finished.then(() => s.remove());
    }
  }

  async function openPack() {
    if (state !== 'idle') return;
    state = 'opening';
    current = draw();
    const r = current.rarity, fast = reduce;
    hint.hidden = true;
    mainBtn.hidden = true;
    pack.style.setProperty('--tear', 1);
    stage.dataset.r = r;

    await anim(packTop, [{ transform: 'none', opacity: 1 }, { transform: 'translate(60px,-90px) rotate(38deg)', opacity: 0 }], { duration: fast ? 1 : 450 });

    // レアほど「溜め」が長い
    if (!fast && (r === 'srare' || r === 'secret')) {
      await Promise.all([
        pack.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px) rotate(-2deg)' }, { transform: 'translateX(5px) rotate(2deg)' }, { transform: 'translateX(0)' }],
          { duration: 120, iterations: r === 'secret' ? 7 : 4 }).finished,
        anim(glow, [{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'scale(1.2)' }], { duration: r === 'secret' ? 840 : 480 })
      ]);
    } else if (!fast) {
      await anim(glow, [{ opacity: 0, transform: 'scale(.4)' }, { opacity: r === 'normal' ? .5 : .9, transform: 'scale(1)' }], { duration: 350 });
    }

    if (!fast && (r === 'secret' || r === 'srare')) {
      const f = document.createElement('div');
      f.className = 'flash';
      document.body.append(f);
      f.animate([{ opacity: 0 }, { opacity: r === 'secret' ? .95 : .6 }, { opacity: 0 }], { duration: 600 }).finished.then(() => f.remove());
      await wait(180);
    }

    revealed = makeSticker(current);
    revealed.idx = 21;
    slot.append(revealed);
    live.push(revealed);
    const colors = { normal: ['#fff', '#ffd6ea'], rare: ['#fff', '#8fd0ff', '#c8e8ff'], srare: ['#fff', '#ff8fd0', '#ffe38a'], secret: ['#fff', '#ffd766', '#ffb3d9', '#8dffc6'] }[r];
    if (r !== 'normal') stage.classList.add('lit');
    if (!fast) burst({ normal: 10, rare: 22, srare: 34, secret: 60 }[r], colors);
    await Promise.all([
      anim(pack, [{ transform: 'none', opacity: 1 }, { transform: 'translateY(140px)', opacity: 0 }], { duration: fast ? 1 : 500 }),
      anim(revealed, [{ transform: 'translateY(70px) scale(.5)', opacity: 0 }, { transform: 'translateY(-8px) scale(1.08)', opacity: 1, offset: .7 }, { transform: 'none', opacity: 1 }],
        { duration: fast ? 1 : 750 })
    ]);

    document.getElementById('rName').textContent = current.name;
    const chip = document.getElementById('rChip');
    chip.className = `chip ${RARITY[r][1]}`;
    chip.textContent = RARITY[r][0];
    document.getElementById('rSerial').textContent = fmt(current);
    document.getElementById('rLeft').textContent = `世界に${current.of.toLocaleString()}枚・残り${(current.of - current.issued).toLocaleString()}枚`;
    result.hidden = false;
    mainBtn.textContent = 'シール帳に貼って、次のパックへ';
    mainBtn.hidden = false;
    state = 'revealed';
  }

  function nextPack() {
    addCell(current, true);
    live.splice(live.indexOf(revealed), 1);
    revealed.remove();
    revealed = current = null;
    result.hidden = true;
    stage.classList.remove('lit');
    stage.removeAttribute('data-r');
    glow.getAnimations().forEach(a => a.cancel());
    [pack, packTop].forEach(el => el.getAnimations().forEach(a => a.cancel()));
    pack.style.setProperty('--tear', 0);
    pack.animate([{ transform: 'translateY(40px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: reduce ? 1 : 400, easing: 'cubic-bezier(.2,.8,.2,1)' });
    hint.hidden = false;
    mainBtn.textContent = 'タップで開ける';
    state = 'idle';
  }

  mainBtn.addEventListener('click', () => {
    if (state === 'idle') openPack();
    else if (state === 'revealed') nextPack();
  });

  // ---------- 友達と交換（ゆいなは自動で動く相手役） ----------
  const byName = n => POOL.find(p => p.name === n);
  const friendHand = [
    { ...byName('ながれぼし'), no: 46 },
    { ...byName('きらきらくも'), no: 91 },
    { ...byName('ゆめかわハート'), no: 120 },
    { ...byName('みかんまる'), no: 2215 },
    { ...byName('ミントぐも'), no: 1880 }
  ];
  const TREASURE = 'ながれぼし'; // ゆいなの宝物。欲しいシールが来たときだけ出す
  const trade = document.getElementById('trade');
  const fHand = document.getElementById('fHand'), mHand = document.getElementById('mHand');
  const fZone = document.getElementById('fZone'), mZone = document.getElementById('mZone');
  const tStatus = document.getElementById('tStatus');
  const beam = document.getElementById('beam');
  const hold = document.getElementById('hold');
  let wanted = null, ready = false, conceded = false, thinkTimer = 0, busy = false;

  const pick = a => a[Math.floor(Math.random() * a.length)];
  function pickWanted() {
    return owned.find(s => s.name === 'いちごミルク') ||
      [...owned].filter(s => s.rarity !== 'secret').sort((a, b) => b.rate - a.rate)[0] || null;
  }
  function updateFriendNote() {
    const w = pickWanted();
    document.getElementById('friendNote').textContent = w ? `「${w.name}」を探してるみたい` : '交換したがっています';
  }
  updateFriendNote();

  function say(el, text) {
    el.textContent = text;
    el.hidden = false;
    el.getAnimations().forEach(a => a.cancel());
    el.animate([{ transform: 'scale(.6)', opacity: 0 }, { transform: 'scale(1.05)', opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }],
      { duration: reduce ? 1 : 300, easing: 'ease-out' });
    clearTimeout(el.t);
    el.t = setTimeout(() => { el.hidden = true; }, 2600);
  }
  const friendSay = t => say(document.getElementById('fBubble'), t);
  const meSay = t => say(document.getElementById('mBubble'), t);
  function setStatus(text, ok) {
    tStatus.textContent = text;
    tStatus.className = ok ? 'ok' : '';
  }

  function tItem(s, owner) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'item';
    b.s = s;
    b.owner = owner;
    b.setAttribute('aria-label', `${s.name} ${fmt(s)}（${RARITY[s.rarity][0]}）`);
    const st = makeSticker(s);
    st.idx = 30 + Math.floor(Math.random() * 20);
    b.append(st);
    b.insertAdjacentHTML('beforeend', `<span class="serial">No.${s.no}</span>` +
      (owner === 'me' && s === wanted ? '<span class="want">ほしい</span>' : '') +
      (owner === 'friend' && s.name === TREASURE ? '<span class="treasure">宝物</span>' : ''));
    return b;
  }
  const items = zone => [...zone.querySelectorAll('.item')];
  const value = zone => items(zone).reduce((v, b) => v + b.s.rate, 0);
  const wantedOffered = () => items(mZone).some(b => b.s === wanted);

  function updateScale() {
    const d = Math.max(-20, Math.min(20, (value(mZone) - value(fZone)) * 7));
    beam.style.transform = `rotate(${d}deg)`;
  }

  function changed() {
    ready = false;
    conceded = false;
    setStatus('考え中…');
    updateScale();
    clearTimeout(thinkTimer);
    thinkTimer = setTimeout(botThink, 650);
  }

  function botThink() {
    const vf = value(fZone), vm = value(mZone), hasWanted = wantedOffered();
    if (vm === 0) { friendSay('なに出してくれる？'); setStatus('あなたのシール待ち'); return; }
    const need = vf - (hasWanted ? 1 : 0);
    if (vm < need) {
      friendSay(pick(['えー、たりない〜', 'もうちょっと！', 'それだとなぁ…']));
      setStatus('まだ納得してない');
      return;
    }
    // もらいすぎなら、ゆいなが1枚足してくれる
    if (vm >= vf + 2) {
      const extra = items(fHand)
        .filter(b => b.s.name !== TREASURE || hasWanted)
        .filter(b => b.s.rate <= vm - vf - 1)
        .sort((a, b) => b.s.rate - a.s.rate)[0];
      if (extra) {
        fZone.append(extra);
        updateScale();
        friendSay(`じゃあ「${extra.s.name}」も付ける！`);
      } else {
        friendSay('ふとっぱら！ありがと〜');
      }
    } else {
      friendSay(pick(['いいよ！', 'それでいこ！', 'おっけー！']));
    }
    ready = true;
    setStatus('OK！ せーのしよ', true);
  }

  function openTrade() {
    wanted = pickWanted();
    fHand.innerHTML = '';
    mHand.innerHTML = '';
    items(fZone).forEach(b => b.remove());
    items(mZone).forEach(b => b.remove());
    friendHand.forEach(s => fHand.append(tItem(s, 'friend')));
    owned.forEach(s => mHand.append(tItem(s, 'me')));
    const first = items(fHand).find(b => b.s.name === 'きらきらくも') || items(fHand).find(b => b.s.name !== TREASURE);
    if (first) fZone.append(first);
    document.getElementById('tMain').hidden = false;
    document.getElementById('tDone').hidden = true;
    ready = conceded = busy = false;
    hold.style.setProperty('--p', 0);
    updateScale();
    trade.showModal();
    setStatus('あなたのシール待ち');
    friendSay(wanted ? `交換しよ〜！「${wanted.name}」ほしいな` : '交換しよ〜！');
  }
  document.getElementById('tradeOpen').addEventListener('click', openTrade);
  document.getElementById('tClose').addEventListener('click', () => trade.close());

  // 自分のシール：タップで出し入れ、ドラッグでテーブルへ
  let drag = null;
  function moveMine(b) {
    (b.parentElement === mZone ? mHand : mZone).append(b);
    changed();
  }
  function tapFriend(b) {
    if (b.parentElement === fZone) {
      fHand.append(b);
      friendSay('え、それいらないの？');
      changed();
      return;
    }
    if (b.s.name === TREASURE && !wantedOffered()) {
      friendSay(wanted ? `それは宝物〜！「${wanted.name}」となら考える` : 'それは宝物だからだめ〜');
      return;
    }
    fZone.append(b);
    friendSay('これ？いいよ〜');
    changed();
  }
  trade.addEventListener('pointerdown', e => {
    const b = e.target.closest('.item');
    if (!b || busy) return;
    drag = { b, x: e.clientX, y: e.clientY, ghost: null };
  });
  trade.addEventListener('pointermove', e => {
    if (!drag || drag.b.owner !== 'me') return;
    if (!drag.ghost && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
      drag.ghost = makeSticker(drag.b.s);
      drag.ghost.classList.add('ghost');
      drag.ghost.idx = 40;
      trade.append(drag.ghost); // ダイアログの上に表示するため中に置く
      drag.b.classList.add('lifted');
    }
    if (drag.ghost) {
      drag.ghost.style.left = e.clientX + 'px';
      drag.ghost.style.top = e.clientY + 'px';
      const over = document.elementFromPoint(e.clientX, e.clientY);
      mZone.classList.toggle('over', !!(over && mZone.contains(over)));
    }
  });
  function endDrag(e) {
    if (!drag) return;
    const { b, ghost } = drag;
    drag = null;
    mZone.classList.remove('over');
    if (!ghost) { // ただのタップ
      if (b.owner === 'me') moveMine(b); else tapFriend(b);
      return;
    }
    ghost.remove();
    b.classList.remove('lifted');
    const over = e && document.elementFromPoint(e.clientX, e.clientY);
    const target = over && mZone.contains(over) ? mZone : over && mHand.contains(over) ? mHand : null;
    if (target && b.parentElement !== target) { target.append(b); changed(); }
  }
  trade.addEventListener('pointerup', endDrag);
  trade.addEventListener('click', e => { // キーボード操作（Enter / Space）
    if (e.detail !== 0 || busy) return;
    const b = e.target.closest('.item');
    if (b) b.owner === 'me' ? moveMine(b) : tapFriend(b);
  });
  trade.addEventListener('pointercancel', () => endDrag(null));

  // スタンプ
  trade.querySelectorAll('.stamp').forEach(btn => btn.addEventListener('click', () => {
    const t = btn.textContent;
    meSay(t);
    setTimeout(() => {
      const vf = value(fZone), vm = value(mZone), need = vf - (wantedOffered() ? 1 : 0);
      if (t === 'おねがい') {
        if (ready) friendSay('もうOKだってば〜');
        else if (vm > 0 && vm === need - 1 && !conceded) {
          conceded = true;
          ready = true;
          friendSay('しょうがないなぁ…いいよ');
          setStatus('OK！ せーのしよ', true);
        } else friendSay(vm === 0 ? 'まずなにか出して〜' : 'さすがにむり〜');
      } else if (t === 'ほしい！') friendSay(pick(['でしょ〜かわいいよね', 'わかる、それレアだもん']));
      else if (t === 'むり〜') friendSay(pick(['えー、じゃあどうする？', 'ほかのにする？']));
      else friendSay(pick(['えへへ', 'でしょ？', 'それもかわいい！']));
    }, 700);
  }));

  // 長押しで「せーの」
  let holdStart = 0, holdRaf = 0;
  function holdTick(now) {
    const p = Math.min(1, (now - holdStart) / 900);
    hold.style.setProperty('--p', p.toFixed(3));
    if (p < 1) { holdRaf = requestAnimationFrame(holdTick); return; }
    holdStart = 0;
    if (!ready || value(mZone) === 0) {
      friendSay(value(mZone) === 0 ? 'まだなにも出してないよ〜' : 'まだだめ〜！');
      hold.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 90, iterations: 3 });
      hold.style.setProperty('--p', 0);
      return;
    }
    doTrade();
  }
  hold.addEventListener('pointerdown', e => {
    if (busy) return;
    hold.setPointerCapture(e.pointerId);
    holdStart = performance.now();
    holdRaf = requestAnimationFrame(holdTick);
  });
  const cancelHold = () => {
    if (!holdStart) return;
    holdStart = 0;
    cancelAnimationFrame(holdRaf);
    hold.style.setProperty('--p', 0);
  };
  hold.addEventListener('pointerup', cancelHold);
  hold.addEventListener('pointercancel', cancelHold);
  hold.addEventListener('keydown', e => { // キーボードでは Enter / Space で決定
    if ((e.key === 'Enter' || e.key === ' ') && !busy) { e.preventDefault(); holdStart = performance.now() - 900; holdTick(performance.now()); }
  });

  async function doTrade() {
    busy = true;
    setStatus('せーの！', true);
    friendSay('せーの！');
    const give = items(mZone), get = items(fZone);
    const dist = mZone.getBoundingClientRect().top - fZone.getBoundingClientRect().top;
    await Promise.all([
      ...give.map(b => b.animate([{ transform: 'none' }, { transform: `translateY(${-dist}px) rotate(360deg) scale(.8)`, opacity: 0 }],
        { duration: reduce ? 1 : 800, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' }).finished),
      ...get.map(b => b.animate([{ transform: 'none' }, { transform: `translateY(${dist}px) rotate(-360deg) scale(1.2)`, opacity: 0 }],
        { duration: reduce ? 1 : 800, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' }).finished)
    ]);

    // データを入れ替える
    give.forEach(b => { removeOwned(b.s); friendHand.push(b.s); });
    get.forEach(b => {
      friendHand.splice(friendHand.indexOf(b.s), 1);
      const s = { ...b.s };
      addCell(s, true);
    });
    updateFriendNote();

    const got = document.getElementById('tGot');
    got.innerHTML = '';
    get.forEach(b => { const st = makeSticker(b.s); st.idx = 50; got.append(st); });
    document.getElementById('tGotText').textContent =
      `${get.map(b => `「${b.s.name}」`).join('')}をゲット！ シール帳に貼りました。`;
    document.getElementById('tMain').hidden = true;
    document.getElementById('tDone').hidden = false;
    busy = false;
  }
  document.getElementById('tFinish').addEventListener('click', () => {
    trade.close();
    book.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  });

  // ---------- 拡大表示 ----------
  const dlg = document.getElementById('dlg');
  let big = null;
  function open(s) {
    const holder = document.getElementById('dSticker');
    holder.innerHTML = '';
    big = makeSticker(s);
    big.idx = 9;
    holder.append(big);
    document.getElementById('dName').textContent = s.name;
    const chip = document.getElementById('dChip');
    chip.className = `chip ${RARITY[s.rarity][1]}`;
    chip.textContent = RARITY[s.rarity][0];
    document.getElementById('dSerial').textContent = fmt(s);
    document.getElementById('dRate').innerHTML =
      Array.from({ length: 5 }, (_, k) => `<i class="${k < s.rate ? 'on' : ''}"></i>`).join('');
    document.getElementById('dNote').textContent =
      `このシールは世界に${s.of.toLocaleString()}枚だけ。あなたのは${s.no}番目です。交換レートは点の数が多いほど高めです。`;
    dlg.showModal();
  }
  document.getElementById('dClose').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', () => { big = null; });

  // ---------- 入力：指・マウス／傾きセンサー／待機中のゆらぎ ----------
  let px = null, py = null, lastInput = -1e9, downX = 0, downY = 0, dragged = false;
  let gyro = null;
  addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; lastInput = performance.now();
    if (Math.hypot(px - downX, py - downY) > 8) dragged = true; });
  addEventListener('pointerdown', e => { px = downX = e.clientX; py = downY = e.clientY; dragged = false; lastInput = performance.now(); });

  const sensorRow = document.getElementById('sensorRow');
  const sensorMsg = document.getElementById('sensorMsg');
  if (typeof DeviceOrientationEvent !== 'undefined' && matchMedia('(pointer: coarse)').matches) {
    sensorRow.hidden = false;
    document.getElementById('sensorBtn').addEventListener('click', async () => {
      try {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          const r = await DeviceOrientationEvent.requestPermission();
          if (r !== 'granted') throw 0;
        }
        let got = false;
        addEventListener('deviceorientation', e => {
          if (e.gamma == null) return;
          got = true;
          gyro = { x: e.gamma / 25, y: (e.beta - 40) / 25 };
        });
        sensorMsg.textContent = '傾けてみてください';
        setTimeout(() => { if (!got) sensorMsg.textContent = 'この画面ではセンサーが使えません。指でなぞって試してください。'; }, 1200);
      } catch {
        sensorMsg.textContent = 'センサーが許可されませんでした。指でなぞって試してください。';
      }
    });
  }

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = v => Math.max(-1, Math.min(1, v));

  function frame(now) {
    const targets = big ? [...live, pack, big] : [...live, pack];
    if (trade.open) targets.push(...trade.querySelectorAll('.st'));
    const idle = now - lastInput > 2500;
    for (const el of targets) {
      let tx = 0, ty = 0;
      if (gyro) { tx = clamp(gyro.x); ty = clamp(gyro.y); }
      else if (!idle && px != null) {
        const r = el.getBoundingClientRect();
        tx = clamp((px - (r.left + r.width / 2)) / (r.width * .9));
        ty = clamp((py - (r.top + r.height / 2)) / (r.height * .9));
      } else if (!reduce) {
        const t = now / 1000;
        tx = .6 * Math.sin(t * .9 + el.idx * .7);
        ty = .45 * Math.sin(t * .7 + el.idx * 1.3);
      }
      el.cx = (el.cx || 0) + (tx - (el.cx || 0)) * .14;
      el.cy = (el.cy || 0) + (ty - (el.cy || 0)) * .14;
      const x = el.cx, y = el.cy;
      el.style.setProperty('--tx', x.toFixed(3));
      el.style.setProperty('--ty', y.toFixed(3));
      el.style.setProperty('--mag', Math.min(1, Math.hypot(x, y)).toFixed(3));
      el.style.setProperty('--sp1', (.2 + .8 * Math.max(0, Math.sin(x * 4 + y * 3 + el.seed))).toFixed(3));
      el.style.setProperty('--sp2', (.2 + .8 * Math.max(0, Math.sin(-x * 3 + y * 4 + el.seed + 2))).toFixed(3));
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
